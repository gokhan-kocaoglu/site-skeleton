openapi: 3.0.3
info:
  title: Site Skeleton API
  version: 0.1.0
  description: >
    Canonical API contract. TypeScript types in packages/api-types are generated
    from this file (openapi-typescript). Keep this file the single source of truth.
servers:
  - url: http://localhost:8080
paths:
  /api/health/live:
    get:
      summary: Liveness probe (no dependency checks)
      operationId: getHealthLive
      tags: [system]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/health/ready:
    get:
      summary: Readiness probe (DB reachable + Flyway baseline applied)
      operationId: getHealthReady
      tags: [system]
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unreachable or migrations not applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          example: UP
