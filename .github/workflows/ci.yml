# CI — Faz 8.1 (audit #6). Doküman: docs/operations/ci.md
# Job adları branch-protection required-checks listesiyle birebir aynıdır;
# ad değiştirirsen dokümandaki listeyi ve GitHub ayarını birlikte güncelle.
# Harici `uses:` referansları tam 40 karakter commit SHA'sına pinlidir ve aynı
# satırda exact release tag yorumu taşır (ADR-0015). Kural verify-structure
# `githubActionsPins` bölümüyle enforce edilir — tag/kısa SHA/yorumsuz pin FAIL.
# Action runtime hattı Node 24'tür; uygulama matrisi Node.js 22 + Java 21 kalır.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality-gate-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # sürümü package.json packageManager alanından okur
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SKIP_API=1: backend'in kendi job'u var (api-verify); gate frontend
      # zincirini koşar: build/typecheck/lint/test/audit/structure/contract-drift.
      # CI env'i set olduğu için gate-audit INCONCLUSIVE = FAIL (merge engeli).
      - run: pnpm gate
        env:
          SKIP_API: "1"

  api:
    name: api-verify-testcontainers
    runs-on: ubuntu-latest # Docker mevcut; Testcontainers gerçek postgres:16 koşar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: apps/api

  windows-parity:
    name: hooks-and-structure-windows
    runs-on: windows-latest # path/CRLF paritesi: hook'lar Windows'ta da çalışmalı
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          # Bu job dependency kurmaz; setup-node'un otomatik paket yöneticisi
          # cache'i istenmeyen bir pnpm store restore'u tetiklemesin.
          package-manager-cache: false
      - run: node .claude/hooks/tests/run-tests.js
      - run: node scripts/verify-structure.mjs
      - run: node scripts/tests/verify-structure-negative.mjs

  gitleaks:
    name: gitleaks-full-history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # tam git geçmişi taraması (audit #24)
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
